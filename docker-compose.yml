services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: dashboard_backend

    env_file:
      - .env

    expose:
      - "3000"

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: dashboard_frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped
